[project]
name = "competitor-shot-list"
version = "0.1.0"
description = "YouTube Short → production-oriented shot list artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "faster-whisper>=1.1.0",
    "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shotlist"]

[tool.hatch.build.targets.wheel.force-include]
"shotlist/fixtures/ci-sample.mp4" = "shotlist/fixtures/ci-sample.mp4"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: full mock analyze on bundled fixture media (requires ffmpeg)",
]
